<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRINITY · AI 팀 관제</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.19/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.19/700.css">
<style>
:root { --bg:#03060c; --panel:rgba(12,19,31,.78); --card:rgba(16,25,40,.8); --line:rgba(90,120,160,.22); --ink:#e8eef7; --sub:#7f90a8; --dim:#46556b;
  --green:#34e0b0; --blue:#6c9dff; --orange:#ff8f5e; --amber:#f5b942; --bad:#ff5c6c; }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; background:radial-gradient(ellipse at 50% 42%, #0a1424 0%, #03060c 68%); color:var(--ink); font-family:"Pretendard",system-ui,sans-serif; overflow:hidden; }
body::before { content:""; position:fixed; inset:0; background-image:radial-gradient(rgba(120,150,190,.13) 1px, transparent 1px); background-size:28px 28px; pointer-events:none; }
button { font:inherit; color:inherit; cursor:pointer; }

/* 상단 바 */
.top { position:fixed; left:0; right:0; top:0; height:46px; display:flex; align-items:center; gap:12px; padding:0 20px; z-index:6; font-size:11px; letter-spacing:.16em; color:var(--sub); }
.top .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }
.top b { color:var(--ink); } .top .sp { flex:1; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:rgba(8,13,22,.6); }
.seg button { background:transparent; border:0; padding:5px 11px; font-size:11px; letter-spacing:.04em; color:var(--sub); }
.seg button.on { background:rgba(108,157,255,.16); color:var(--ink); box-shadow:inset 0 0 0 1px rgba(108,157,255,.5); border-radius:6px; }
.badge { padding:3px 9px; border-radius:99px; border:1px solid var(--line); font-size:10.5px; letter-spacing:.06em; color:var(--sub); }
.badge.ok { color:var(--green); border-color:rgba(52,224,176,.4); background:rgba(52,224,176,.08); }
.badge.run { color:var(--blue); border-color:rgba(108,157,255,.45); background:rgba(108,157,255,.1); }
.badge.bad { color:var(--bad); border-color:rgba(255,92,108,.4); background:rgba(255,92,108,.08); }
.badge.lim { color:var(--amber); border-color:rgba(245,185,66,.4); background:rgba(245,185,66,.08); }

.app { position:fixed; inset:46px 0 0 0; display:grid; grid-template-columns:318px 1fr 336px; gap:14px; padding:0 14px 14px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(6px); min-height:0; }
.hd { font-size:10.5px; letter-spacing:.2em; color:var(--sub); font-weight:600; }
.scroll { overflow:auto; scrollbar-width:thin; scrollbar-color:#223048 transparent; }

/* 왼쪽 */
.left { display:flex; flex-direction:column; }
.left .in { padding:16px; }
.status h1 { margin:8px 0 0; font-size:21px; line-height:1.3; letter-spacing:-.02em; }
.status p { margin:6px 0 0; color:var(--sub); font-size:12px; }
.timer { margin-top:10px; font-size:30px; font-weight:700; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
.timer small { font-size:11px; color:var(--sub); margin-left:6px; letter-spacing:0; font-weight:500; }
.mission { margin-top:14px; border:1px solid var(--line); border-radius:10px; background:var(--card); padding:12px; }
.mission .r { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--sub); letter-spacing:.08em; }
.mission .txt { margin:8px 0; font-size:12.5px; line-height:1.55; color:#c6d2e2; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
.steps { display:flex; gap:6px; } .steps i { font-style:normal; flex:1; text-align:center; font-size:11px; padding:4px 0; border-radius:6px; border:1px solid var(--line); color:var(--dim); }
.steps i.done { color:var(--green); border-color:rgba(52,224,176,.5); background:rgba(52,224,176,.08); }
.steps i.now { color:var(--ink); border-color:var(--blue); background:rgba(108,157,255,.12); }
.mission .meta { margin-top:8px; font-size:11px; color:var(--sub); }
.sub-hd { display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px; }
textarea { width:100%; height:78px; resize:vertical; background:rgba(5,9,16,.7); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:9px 11px; font:inherit; font-size:12.5px; }
textarea:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(52,224,176,.12); }
.chk { display:flex; gap:12px; margin:8px 0; font-size:12.5px; color:var(--sub); } .chk label { display:flex; align-items:center; gap:5px; cursor:pointer; } .chk input { accent-color:var(--green); }
button.go { width:100%; background:var(--green); color:#03140e; border:0; border-radius:8px; padding:10px; font-weight:800; letter-spacing:.02em; }
button.go:disabled { opacity:.4; cursor:default; }
.hint { color:var(--dim); font-size:11px; margin-top:7px; }
.item { border-left:2px solid var(--c,#456); padding:1px 0 1px 10px; margin-bottom:12px; }
.item .n { display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--c); } .item .n small { color:var(--sub); font-weight:500; }
.item pre { margin:5px 0 0; white-space:pre-wrap; word-break:break-word; font:11.5px/1.6 "Pretendard",monospace; color:#b4c1d3; max-height:200px; overflow:auto; }
.log .row { display:flex; align-items:center; gap:8px; padding:7px 8px; margin-bottom:5px; border:1px solid var(--line); border-radius:7px; background:rgba(10,16,27,.7); font-size:11.5px; }
.log .tag { font-weight:700; letter-spacing:.02em; min-width:74px; } .log .who { color:var(--sub); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .log .ago { color:var(--dim); font-size:10.5px; }

/* 가운데 */
.center { position:relative; background:transparent; border:0; backdrop-filter:none; overflow:hidden; }
canvas { position:absolute; inset:0; width:100%; height:100%; }
.stages { position:absolute; left:12px; right:12px; top:8px; display:flex; gap:10px; opacity:0; transition:opacity .5s; pointer-events:none; z-index:2; }
.stages.on { opacity:1; }
.sc { flex:1; min-width:0; max-width:150px; margin:0 auto; padding:8px 12px 9px; border-radius:9px; border:1.5px solid var(--cc); background:rgba(8,13,22,.85); box-shadow:0 0 18px color-mix(in srgb, var(--cc) 25%, transparent); opacity:.45; transition:opacity .3s; }
.sc.on { opacity:1; box-shadow:0 0 26px color-mix(in srgb, var(--cc) 45%, transparent); }
.sc small { display:block; font-size:9.5px; letter-spacing:.14em; font-weight:700; color:var(--cc); } .sc b { font-size:19px; letter-spacing:-.02em; }
.brand { position:absolute; padding:7px 14px; border:1.5px solid var(--cc); border-radius:8px; background:rgba(8,13,22,.8); box-shadow:0 0 18px color-mix(in srgb, var(--cc) 22%, transparent); z-index:2; }
.brand small { display:block; font-size:9px; letter-spacing:.22em; color:var(--sub); } .brand b { font-size:19px; letter-spacing:.02em; color:var(--cc); }
.core-label { position:absolute; left:22px; bottom:76px; z-index:2; } .core-label b { display:block; font-size:34px; letter-spacing:-.02em; line-height:1.1; }
.core-label span { font-size:11px; color:var(--sub); letter-spacing:.08em; }
.core-label small { display:none; font-size:10px; letter-spacing:.18em; color:var(--sub); margin-top:6px; }
.pipe { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:9px 20px; z-index:2; }
.pipe .s { display:flex; align-items:center; gap:7px; white-space:nowrap; font-size:11.5px; color:var(--dim); } .pipe .s i { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--dim); }
.pipe .s small { display:block; font-size:8.5px; letter-spacing:.14em; }
.pipe .s.on { color:var(--ink); } .pipe .s.on i { background:var(--green); border-color:var(--green); box-shadow:0 0 10px var(--green); }
.pipe .s.done { color:var(--sub); } .pipe .s.done i { background:var(--sub); border-color:var(--sub); }
.pipe .bar { width:26px; height:1px; background:var(--line); margin:0 7px; }

/* 오른쪽 */
.right { display:flex; flex-direction:column; }
.right .sec { padding:14px 16px; border-bottom:1px solid var(--line); } .right .sec:last-child { border:0; }
.right .top2 { display:flex; justify-content:space-between; align-items:center; }
.big { font-size:34px; font-weight:800; letter-spacing:-.03em; margin-top:8px; line-height:1; } .big small { font-size:12px; color:var(--sub); font-weight:500; letter-spacing:0; margin-left:4px; }
.sumline { font-size:11.5px; color:var(--sub); margin-top:7px; }
.stack { display:flex; height:4px; border-radius:9px; overflow:hidden; margin-top:10px; background:rgba(120,150,190,.14); } .stack i { display:block; height:100%; }
.role { margin-top:10px; border:1px solid var(--line); border-radius:9px; background:var(--card); padding:10px 12px; }
.role .r { display:flex; justify-content:space-between; align-items:baseline; font-size:10px; letter-spacing:.14em; color:var(--sub); } .role .r b { font-size:12px; letter-spacing:.02em; }
.role .nums { display:grid; grid-template-columns:repeat(3,1fr); margin:7px 0 8px; } .role .nums div { font-size:17px; font-weight:700; } .role .nums small { display:block; font-size:10px; font-weight:500; color:var(--sub); }
.meter { height:3px; border-radius:9px; background:rgba(120,150,190,.15); overflow:hidden; } .meter i { display:block; height:100%; background:var(--c); }
.call { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:11.5px; cursor:pointer; } .call:first-of-type { border-top:0; }
.call .a { font-weight:700; } .call .b { color:var(--sub); font-size:10.5px; } .call .t { color:var(--dim); font-size:10.5px; text-align:right; white-space:nowrap; } .call:hover .b { color:var(--ink); }
.conn { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12px; color:var(--sub); } .conn i { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; background:var(--dim); }
.conn.ok i { background:var(--green); box-shadow:0 0 8px var(--green); } .conn.bad i { background:var(--bad); } .conn.lim i { background:var(--amber); }
.conn b { font-size:10.5px; letter-spacing:.06em; font-weight:600; }
.role { cursor:pointer; transition:border-color .15s; } .role:hover { border-color:var(--c); } .lim { display:flex; justify-content:space-between; align-items:baseline; margin-top:9px; font-size:11.5px; color:var(--sub); } .lim b { font-size:13px; } .limsub { font-size:11px; color:var(--sub); margin-top:3px; }
.role .mdl { font-size:11px; color:var(--sub); margin-top:3px; }
.pop { position:absolute; z-index:8; width:300px; max-height:calc(100% - 24px); overflow:auto; background:rgba(9,15,26,.97); border:1.5px solid var(--cc,var(--line)); border-radius:12px; padding:14px; box-shadow:0 12px 40px rgba(0,0,0,.6), 0 0 24px color-mix(in srgb, var(--cc) 25%, transparent); }
.pop[hidden] { display:none; }
.pop h3 { margin:0; display:flex; justify-content:space-between; align-items:center; font-size:16px; } .pop h3 small { font-size:9.5px; letter-spacing:.18em; color:var(--sub); display:block; font-weight:600; }
.pop h3 button { background:transparent; border:0; color:var(--sub); font-size:18px; line-height:1; }
.pop .cur { margin:10px 0 8px; font-size:12px; color:var(--sub); } .pop .cur b { color:var(--ink); font-size:13px; }
.pop .opts { max-height:190px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.pop .opt { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:7px 10px; font-size:12px; }
.pop .opt:last-child { border-bottom:0; } .pop .opt small { color:var(--dim); font-size:10.5px; } .pop .opt:hover { background:rgba(120,150,190,.1); }
.pop .opt.on { background:color-mix(in srgb, var(--cc) 14%, transparent); color:var(--ink); box-shadow:inset 2px 0 0 var(--cc); }
.pop .custom { display:flex; gap:6px; margin-top:8px; } .pop .custom input { flex:1; min-width:0; background:rgba(5,9,16,.8); border:1px solid var(--line); border-radius:7px; color:var(--ink); padding:6px 9px; font:inherit; font-size:12px; }
.pop .custom button, .pop .reset { background:transparent; border:1px solid var(--line); border-radius:7px; color:var(--ink); padding:6px 10px; font-size:11.5px; } .pop .custom button:hover, .pop .reset:hover { border-color:var(--cc); }
.pop .use { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; } .pop .use div { border:1px solid var(--line); border-radius:8px; padding:7px 8px; font-size:15px; font-weight:700; } .pop .use small { display:block; font-size:10px; color:var(--sub); font-weight:500; }
.pop .msg { margin-top:9px; font-size:11px; color:var(--sub); line-height:1.5; } .pop .msg.ok { color:var(--green); } .pop .msg.bad { color:var(--bad); }
/* ===== 테마: 우주 관제실 (MISSION) — 앰버 한 색 + 고정폭 글꼴 + 각진 모서리 ===== */
body.mission { --bg:#050607; --panel:rgba(10,9,6,.86); --card:rgba(18,15,8,.85); --line:rgba(255,176,32,.22); --ink:#ffe9c2; --sub:#a8905a; --dim:#5e5030;
  --green:#ffb020; --blue:#ffb020; font-family:"JetBrains Mono","Pretendard",ui-monospace,Consolas,monospace; background:radial-gradient(ellipse at 50% 45%, #120d04 0%, #050607 70%); }
body.mission::before { background-image:linear-gradient(rgba(255,176,32,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,176,32,.045) 1px, transparent 1px); background-size:40px 40px; }
body.mission .panel, body.mission .mission, body.mission .role, body.mission .sc, body.mission .brand, body.mission .pop, body.mission .row, body.mission .pipe, body.mission textarea, body.mission .seg, body.mission .opts, body.mission .use div { border-radius:2px; }
body.mission .panel { border-color:rgba(255,176,32,.3); }
body.mission .center { border:0; }
body.mission .hd, body.mission .sc small, body.mission .brand small, body.mission .pipe small, body.mission .role .r, body.mission .core-label span { letter-spacing:.2em; }
body.mission .sc { --cc:#ffb020 !important; } body.mission .brand { --cc:#ffb020 !important; background:rgba(14,10,3,.9); }
body.mission .brand b { color:#ffe9c2; letter-spacing:.12em; font-size:16px; }
body.mission .sc.on { background:rgba(255,176,32,.12); }
body.mission .core-label b { letter-spacing:.06em; color:#ffb020; text-shadow:0 0 14px rgba(255,176,32,.45); }
body.mission button.go { color:#1a1200; border-radius:2px; }
body.mission .seg button.on { background:rgba(255,176,32,.16); box-shadow:inset 0 0 0 1px rgba(255,176,32,.55); }
body.mission .badge.ok, body.mission .badge.run { color:#ffb020; border-color:rgba(255,176,32,.45); background:rgba(255,176,32,.08); }
body.mission .center::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,176,32,.035) 0 1px, transparent 1px 3px); z-index:1; }
body.solar { background:radial-gradient(ellipse at 50% 46%, #0c1233 0%, #060a1d 55%, #02030a 100%); }
body.solar .brand { border-radius:10px; }
/* ===== 관제실: 목표물 패널 · 조작 바 · 저장된 로그 ===== */
.mcbar { display:none !important; position:absolute; left:14px; top:84px; z-index:6; flex-direction:column; gap:6px; } body.mission .mcbar { display:none !important; }
.mcbtn { background:rgba(0,0,0,.4); border:1px solid var(--line); border-radius:4px; color:var(--ink); padding:6px 11px; font-size:11px; letter-spacing:.04em; text-align:left; } .mcbtn:hover { border-color:var(--green); color:var(--green); }
.cmds { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; } .cmds button { flex:1 1 auto; background:transparent; border:1px solid var(--line); border-radius:4px; color:var(--ink); padding:7px 10px; font-size:12px; font-weight:600; } .cmds button:hover { border-color:var(--cc); color:var(--cc); }
.mclog { position:absolute; left:14px; top:150px; width:320px; max-height:320px; overflow:auto; z-index:7; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:11px; line-height:1.5; }
.mclog[hidden] { display:none; } .mclog .h { color:var(--sub); letter-spacing:.14em; font-size:9.5px; margin-bottom:6px; } .mclog .r { padding:4px 0; border-top:1px solid var(--line); color:var(--ink); display:block; word-break:break-word; } .mclog .t { color:var(--sub); margin-right:6px; } .mclog b { color:var(--green); margin-right:4px; } .mclog i { font-style:normal; color:var(--sub); }
/* ===== AI 연동 창 ===== */
.connpanel { position:fixed; top:52px; right:14px; width:410px; max-height:calc(100vh - 70px); overflow:auto; z-index:70; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 18px 50px rgba(0,0,0,.6); }
.connpanel[hidden] { display:none; } .connpanel .ch { display:flex; justify-content:space-between; align-items:center; font-size:15px; } .connpanel .ch button { background:transparent; border:0; color:var(--sub); font-size:20px; line-height:1; }
.connpanel .cnote { color:var(--sub); font-size:12px; margin:8px 0 12px; line-height:1.6; } .connpanel .crow { border-top:1px solid var(--line); padding:12px 0; }
.connpanel .ct { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13.5px; } .connpanel .ct small { color:var(--sub); }
.cbadge { margin-left:auto; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--sub); font-size:11px; } .cbadge.on { color:var(--green); border-color:color-mix(in srgb, var(--green) 50%, transparent); background:color-mix(in srgb, var(--green) 10%, transparent); }
.connpanel .cb { display:flex; gap:6px; flex-wrap:wrap; } .connpanel input[type=password] { flex:1; min-width:0; background:rgba(5,9,16,.8); border:1px solid var(--line); border-radius:7px; color:var(--ink); padding:7px 10px; font:inherit; font-size:12.5px; }
.cbtn { background:transparent; border:1px solid var(--line); border-radius:7px; color:var(--ink); padding:7px 11px; font-size:12px; font-weight:600; } .cbtn:hover:not(:disabled) { border-color:var(--green); color:var(--green); } .cbtn:disabled { opacity:.4; }
.copt { display:flex; align-items:center; gap:7px; margin-top:9px; font-size:12px; color:var(--sub); } .copt small { color:var(--dim); } .cwarn, .cnote2 { margin-top:8px; font-size:11.5px; color:var(--sub); line-height:1.55; } .cwarn { color:#f5b942; }
.cmd { display:flex; align-items:center; gap:8px; margin-top:7px; padding:6px 8px; border:1px solid var(--line, rgba(120,140,170,.25)); border-radius:8px; background:rgba(0,0,0,.25); } .cmd code { flex:1; font-size:11px; word-break:break-all; user-select:all; } .cnote2 code { font-size:11px; user-select:all; } .cnote2 a { color:var(--green, #34e0b0); }
.cmsg { min-height:18px; margin-top:6px; font-size:12px; color:var(--green); } .cmsg.bad { color:#ff7b86; }
/* ===== 디자인 선택 드롭다운 ===== */
.dd { position:relative; }
.ddbtn { background:rgba(8,13,22,.6); border:1px solid var(--line); border-radius:8px; padding:5px 12px; font-size:11.5px; color:var(--sub); letter-spacing:.04em; display:inline-flex; align-items:center; gap:4px; }
.ddbtn b { color:var(--ink); font-weight:700; } .ddbtn .car { font-size:10px; transition:transform .15s; } .ddbtn[aria-expanded="true"] .car { transform:rotate(180deg); } .ddbtn:hover, .ddbtn[aria-expanded="true"] { border-color:var(--green); }
.ddmenu { position:absolute; right:0; top:calc(100% + 8px); width:290px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 16px 44px rgba(0,0,0,.55); z-index:30; letter-spacing:0; }
.ddmenu[hidden] { display:none; }
.ddmenu button { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:transparent; border:0; border-radius:8px; padding:9px 10px; color:var(--ink); }
.ddmenu button:hover { background:rgba(120,150,190,.12); } .ddmenu button.on { background:rgba(120,150,190,.16); box-shadow:inset 2px 0 0 var(--green); }
.ddmenu i { width:30px; height:30px; border-radius:8px; border:1px solid var(--line); flex:none; }
.ddmenu span { display:flex; flex-direction:column; } .ddmenu b { font-size:13px; } .ddmenu small { font-size:11px; color:var(--sub); margin-top:1px; }
body.mission.light .ddbtn { background:#fff; } body.mission.light .ddmenu { box-shadow:0 16px 44px rgba(40,60,90,.2); }
/* ===== 테마: 라이트(미니멀) / 레트로(터미널) — 관제실 레이더 화면을 다른 색으로 ===== */

<script>
/* =====================================================================
   설정값 — 이름·색·역할·위치·단계 이름은 여기만 바꾸면 됩니다.
   ===================================================================== */
const CONFIG = {
  nodes: {
    codex:  { name:'Codex',  brand:'OPENAI',    tag:'REVIEWER · 코드 검수',  role:'코드·보안·테스트', stageKo:'검수', color:'#34e0b0', pos:[0.46, 0.21], card:['left', -0.27, -0.02] },
    gemini: { name:'Gemini', brand:'GOOGLE',    tag:'REVIEWER · 설계 검수',  role:'설계·아이디어',   stageKo:'검수', color:'#6c9dff', pos:[0.22, 0.66], card:['left', -0.16, -0.15] },
    claude: { name:'Claude', brand:'ANTHROPIC', tag:'HEAD · 지휘·구현',      role:'구현·최종 판단',   stageKo:'구현', color:'#ff8f5e', pos:[0.78, 0.66], card:['left', -0.07, -0.20] },
  },
  reviewers: ['codex', 'gemini'],          // 리뷰 요청 때 호출하는 AI
  stages: [                                  // 가운데 위 카드 (영상의 계획·구현·테스트·검수·판단)
    { tag:'HEAD',     ko:'계획', color:'#34e0b0' },
    { tag:'BUILDER',  ko:'구현', color:'#6c9dff' },
    { tag:'VERIFIER', ko:'테스트', color:'#cfd8e6' },
    { tag:'REVIEWER', ko:'검수', color:'#ff8f5e' },
    { tag:'HEAD',     ko:'판단', color:'#34e0b0' },
  ],
  pipeline: [['계획','HEAD'],['구현','BUILDER'],['테스트','VERIFIER'],['검수','REVIEWER'],['판단','HEAD']],
  tabs: { mission:'이번 미션', today:'오늘', all:'전체' },
};
const N = CONFIG.nodes, KEYS = Object.keys(N);
const rgba = (h,a) => { const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
/* 로그인이 풀리면(401) 어떤 요청에서든 로그인 화면으로 보낸다 */
{ const _f = window.fetch.bind(window); window.fetch = (...a) => _f(...a).then(r => { if (r.status === 401) location.href = '/login'; return r; }); }
const $ = id => document.getElementById(id);
setInterval(() => fetch('/api/alive').catch(() => {}), 20000);                        // 창이 열려 있다는 신호(닫으면 서버가 스스로 꺼짐)
fetch('/api/me').then(r => r.json()).then(d => { if (d && d.user) $('who').textContent = d.user; }).catch(() => {});
$('logout').onclick = async () => { try { await fetch('/logout', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:'' }); } catch (e) { /* 실패해도 이동 */ } location.href = '/login'; };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ===== 상태 ===== */
const state = { codex:'idle', gemini:'idle', claude:'idle' }; // idle|running|done|failed|limit
let stage = -1;              // 파이프라인에서 켜진 단계 (3=검수, 4=판단, 1=구현)
let runStart = 0, runEnd = 0, history = [], live = null, selected = null, tab = 'mission';
let claudeInfo = { ok:false }, conns = {}, reviewActive = false;

/* ===== 캔버스 ===== */
const cv = $('cv'), g = cv.getContext('2d');
let W, H, dpr, orbs = {}, flows = [], stars = [], tk = 0;
function fib(n) { const pts=[], ga=Math.PI*(3-Math.sqrt(5)); for (let i=0;i<n;i++){ const y=1-2*(i+.5)/n, r=Math.sqrt(1-y*y), t=ga*i; pts.push([Math.cos(t)*r, y, Math.sin(t)*r]); } return pts; }
function layout() {
  dpr = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  KEYS.forEach(k => { const o = orbs[k] || (orbs[k] = { pts:fib(300), rot:Math.random()*6 }); o.hx = o.x = N[k].pos[0]*W; o.hy = o.y = N[k].pos[1]*H; o.r = Math.min(W,H)*0.078; });
  stars = Array.from({length:90}, () => [Math.random()*W, Math.random()*H, Math.random()*1.3+.3, Math.random()*6]);
  placeBrands();
}
const rings = [{c:'#34e0b0',tilt:0.35,n:460},{c:'#ff8f5e',tilt:-0.95,n:460},{c:'#6c9dff',tilt:1.55,n:460}]
  .map(r => ({...r, pts:Array.from({length:r.n}, () => ({a:Math.random()*6.283,w:(Math.random()-.5)*0.16,h:(Math.random()-.5)*0.16,s:Math.random()*1.3+.4}))}));
const core = () => ({ x:W*0.5, y:H*0.55, r:Math.min(W,H)*0.16 });
const AMBER = '#f5b942', RED = '#ff5c6c';
const nodeColor = k => state[k]==='failed' ? RED : state[k]==='limit' ? AMBER : N[k].color;

/* ===== MISSION 테마: 레이더 관제 화면 ===== */
let theme = 'trinity';
let AMB = '#ffb020', ACC = [255, 176, 32], TXT = '#ffe9c2';                    // 레이더 계열 테마의 포인트색 (관제실=앰버, 라이트=남색, 레트로=초록)
const amb = a => `rgba(${ACC[0]},${ACC[1]},${ACC[2]},${a})`;
/* =====================================================================================
   관제실 모듈 — Events(기록) · Targets(가상 목표물) · Commands(관제 명령) · Panel(상세 패널) · HUD(상태판)
   기능을 더하려면: 명령은 Commands에 항목 하나, 표시는 Targets.draw / HUD.draw 에 추가하면 된다.
   (모두 가상의 신호·표시이며, 실제 장비와 통신하지 않는다. 실제 이상 상황은 mcAnoms()가 읽기 전용으로 가져온다.)
   ===================================================================================== */
const MONO = '"JetBrains Mono", monospace';
const hms = () => { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(pad).join(':'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ST = { incoming:'접근 중', detected:'탐지됨', tracking:'추적 중', held:'보류', resolving:'해소 중', passing:'통과 중', resolved:'해소됨', passed:'통과 완료', lost:'소실' };
const isFinal = t => t.state === 'resolved' || t.state === 'lost' || t.state === 'passed';
const sevCol = t => t.sim ? AMB : (t.sev >= 2 ? RED : AMBER);
const SIM_KINDS = { 'LATENCY SPIKE':'NETWORK', 'CONTEXT DRIFT':'LOAD', 'QUEUE BURST':'LOAD', 'TIMEOUT RISK':'NETWORK', 'NOISE FLOOR':'SIGNAL', 'SIGNAL JITTER':'SIGNAL' };
const SIM_LABELS = Object.keys(SIM_KINDS);
const NORMAL_LABELS = ['HEARTBEAT', 'SYNC PING', 'STATUS REPORT', 'CACHE REFRESH', 'TELEMETRY'];                    // 정상 신호(통과 승인 대상)

/* ── Events: 화면 로그 + 서버에 저장(events.jsonl) ── */
const Events = {
  log:[],
  push(tag, text, col, t) {
    this.log.unshift({ t:hms(), tag, text, col }); if (this.log.length > 30) this.log.pop();
    fetch('/api/event', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ tag, text, target:t ? `T-${pad(t.id)}` : '', sim:t ? t.sim : false }) }).catch(() => {});
    if (!$('mclog').hidden) setTimeout(() => this.render(), 250);
  },
  async render() {
    let rows = []; try { rows = await (await fetch('/api/events')).json(); } catch (e) { /* 서버 응답 없으면 빈 목록 */ }
    $('mclog').innerHTML = '<div class="h">EVENT LOG · 저장된 기록</div>' + (rows.length ? rows.map(r => `<div class="r"><span class="t">${r.ts.slice(5, 16)}</span><b>${esc(r.tag)}</b>${r.sim ? ' <i>SIM</i>' : ''}<br>${esc(r.text)}</div>`).join('') : '<div class="r">기록이 아직 없어요.</div>');
  },
};

/* ── 실제 이상 상황(읽기 전용) ── */
function mcAnoms() {
  const out = {}, now = Date.now();
  history.slice(0, 6).forEach(h => { const t = new Date(h.started.replace(' ', 'T')).getTime(); if (now - t > 15*60000) return;
    Object.entries(h.who).forEach(([k, w]) => { if (w.status === 'failed') out[`run-${h.id}-${k}`] = { ai:k, label:`${N[k].name} ${w.reason === 'limit' ? '한도 소진' : '호출 실패'}`, sev:w.reason === 'limit' ? 1 : 2, cls:w.reason === 'limit' ? 'QUOTA' : 'RUN FAILURE', retry:{ ai:k, prompt:h.prompt } }; }); });
  if (claudeInfo.ok) { if (claudeInfo.percent >= 75) out.ctx = { ai:'claude', label:`Claude 컨텍스트 ${claudeInfo.percent}%`, sev:claudeInfo.percent >= 90 ? 2 : 1, cls:'CONTEXT' };
    if (claudeInfo.five_hour >= 80) out.h5 = { ai:'claude', label:`5시간 한도 ${claudeInfo.five_hour}%`, sev:claudeInfo.five_hour >= 95 ? 2 : 1, cls:'QUOTA' };
    if (claudeInfo.seven_day >= 85) out.d7 = { ai:'claude', label:`7일 한도 ${claudeInfo.seven_day}%`, sev:claudeInfo.seven_day >= 95 ? 2 : 1, cls:'QUOTA' }; }
  [['codex', 'Codex'], ['gemini', 'Gemini'], ['claude', 'Claude 사용량']].forEach(([k, l]) => { if (conns[k] === false) out['conn-' + k] = { ai:k, label:`${l} 연결 안 됨`, sev:1, cls:'NOT CONNECTED' }; });
  return out;
}

/* ── Targets: 가상 목표물(생성·이동·탐지·상태 변경·그리기·선택) ── */
const MC = { targets:[], n:0, ack:new Set(), nextSim:0, nextSync:0, total:0, resolved:0, passed:0, sel:null, pulse:0, auto:true };
const Targets = {
  make(c, R, o) {
    const tgt = o.ai ? orbs[o.ai] : null, ang = tgt ? Math.atan2(tgt.y - c.y, tgt.x - c.x) + (Math.random() - .5)*1.3 : Math.random()*6.283, a2 = ang + (Math.random() - .5)*.8, r2 = R*(.25 + Math.random()*.25);

/* ── Commands: 관제 명령 모음 — 새 명령은 여기에 항목만 추가 ── */

  retry:    { label:'재시도', can:t => !!t.retry && !t.busy, async run(t) {                                   // 실제 동작: 실패한 호출을 같은 요청으로 다시 실행
      t.busy = true; Panel.msg('재시도 중…'); Events.push('CMD', `T-${pad(t.id)} 재시도(${N[t.retry.ai].name})`, ACC, t); Panel.refresh(t);

      t.busy = false; loadAll();
      if (ok) { Events.push('RESULT', `T-${pad(t.id)} 재시도 성공`, ACC, t); Targets.begin(t, 'RESOLVED'); Panel.msg('재시도 성공 — 해소 절차 진행'); }

const fmtLeft = iso => { const ms = Date.parse(iso) - Date.now(); if (!(ms > 0)) return '곧'; const m = Math.floor(ms/60000), d = Math.floor(m/1440), hh = Math.floor((m % 1440)/60), mm = m % 60; return d ? `${d}일 ${hh}시간` : (hh ? `${hh}시간 ${mm}분` : `${mm}분`); };

  return `<div class="lim"><span>${lab}</span><b style="color:${col}">남은 ${left}%</b></div><div class="meter"><i style="width:${used}%;background:${col}"></i></div><div class="limsub">${rst ? fmtLeft(rst) + ' 뒤 초기화' : ''}</div>`; };
/* Codex 한도 소진 시각: 마지막 Codex 호출이 "사용 한도" 응답이면 그 안의 "Nov 11th, 2026 2:07 AM" 같은 시각을 읽어 보여 줌 */
const MON = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function parseResetText(text) {
  const m = /([A-Z][a-z]{2})[a-z]* (\d{1,2})(?:st|nd|rd|th)?, (\d{4}) (\d{1,2}):(\d{2}) (AM|PM)/.exec(text || ''); if (!m || !(m[1] in MON)) return null;
  let hr = Number(m[4]) % 12; if (m[6] === 'PM') hr += 12; return new Date(Number(m[3]), MON[m[1]], Number(m[2]), hr, Number(m[5]));
}

  const ms = at.getTime() - Date.now(), ap = at.getHours() < 12 ? '오전' : '오후', h12 = at.getHours() % 12 || 12, when = `${at.getMonth() + 1}월 ${at.getDate()}일 ${ap} ${h12}:${String(at.getMinutes()).padStart(2, '0')}`;

  const at = new Date(w.reset_at), ms = at.getTime() - Date.now(), ap = at.getHours() < 12 ? '오전' : '오후', h12 = at.getHours() % 12 || 12, p2 = n => String(n).padStart(2, '0');
  const when = `${ap} ${h12}:${p2(at.getMinutes())}:${p2(at.getSeconds())}`, left = ms < 60000 ? Math.max(1, Math.ceil(ms/1000)) + '초' : fmtLeft(at.toISOString());

    ${m.changeable ? `<div class="opts">${opts || '<div class="msg" style="padding:8px">목록을 불러오지 못했어요. 아래에 직접 입력해 주세요.</div>'}</div>
      <div class="custom"><input id="pop-in" placeholder="모델 이름 직접 입력" maxlength="80"><button id="pop-go">적용</button></div>
      <div style="margin-top:8px"><button class="reset" id="pop-reset">기본값으로 되돌리기${m.default ? ' (' + esc(m.default) + ')' : ''}</button></div>` : `<div class="msg">${esc(m.note || '')}</div>`}
    ${usageBlock(k)}
    <div class="msg ${popMsg && popMsg.bad ? 'bad' : (popMsg ? 'ok' : '')}" id="pop-msg">${popMsg ? esc(popMsg.text) : (m.changeable ? (k==='claude' ? esc(m.note || '') : '고른 모델은 다음 호출부터 적용돼요. ' + (k==='codex' ? 'Codex 설정 파일은 바꾸지 않고, 호출할 때만 모델을 지정합니다.' : '목록에 있어도 계정에 따라 호출이 안 되는 모델이 있을 수 있어요.')) : '')}</div>`;
  const W0 = $('center').clientWidth, H0 = $('center').clientHeight;
  p.style.left = Math.max(8, Math.min(W0 - 308, o.x - 150)) + 'px'; p.style.top = Math.max(8, Math.min(H0 - p.offsetHeight - 8 || 0, o.y + o.r * 0.6)) + 'px';
  p.hidden = false;
  p.style.top = Math.max(8, Math.min(H0 - p.offsetHeight - 8, o.y - o.r)) + 'px';
  $('pop-x').onclick = closePop;
  p.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setModel(k, b.dataset.m));
  if ($('pop-go')) { $('pop-go').onclick = () => { const v = $('pop-in').value.trim(); if (v) setModel(k, v); };
    $('pop-in').onkeydown = e => { if (e.key === 'Enter') $('pop-go').click(); }; $('pop-reset').onclick = () => setModel(k, ''); }
}
function closePop() { $('pop').hidden = true; popAi = null; popMsg = null; }
async function setModel(k, model) {
  const r = await fetch('/api/model', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ai:k, model}) });
  popMsg = r.ok ? { text: model ? (k==='claude' ? `Claude 모델을 ${model}(으)로 저장했어요. 새로 여는 세션부터 적용돼요.` : `${N[k].name} 모델을 ${model}(으)로 바꿨어요. 다음 호출부터 적용돼요.`) : '기본값으로 되돌렸어요.' } : { bad:true, text:'모델 이름 형식이 올바르지 않아요.' };
  await loadModels(); renderRight(); if (popAi === k) openPop(k);
}
async function loadModels() { try { models = await (await fetch('/api/models')).json(); } catch (e) {} }
function hitNode(ev) {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  return KEYS.find(k => { const o = orbs[k]; return Math.hypot(x - o.x, y - (o.y + o.r*.55)) < o.r * 1.5 + 14 || (Math.abs(x - o.x) < 80 && y > o.y + o.r*1.5 && y < o.y + o.r*1.75 + 82); });
}
cv.addEventListener('click', e => {
  if (theme === 'mission' || theme === 'retro' || theme === 'light') { const t = Targets.hit(e); if (t) { closePop(); Panel.open(t); return; } }   // 관제실: 목표물 클릭 → 상세 패널
  const k = hitNode(e); if (k) { popMsg = null; Panel.close(); openPop(k); } else { closePop(); if (theme !== 'solar' && typeof Panel !== 'undefined') Panel.close(); } });
cv.addEventListener('mousemove', e => { hoverK = hitNode(e) || null; const onT = (theme === 'mission' || theme === 'retro' || theme === 'light') && typeof Targets !== 'undefined' && Targets.hit(e); cv.style.cursor = (hoverK || onT) ? 'pointer' : 'default'; });   // 행성 위에 마우스를 올리면 천천히 돌아서 누르기 쉬움
cv.addEventListener('mouseleave', () => { hoverK = null; });
$('pop').addEventListener('click', e => e.stopPropagation());
addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

/* ===== 불러오기 ===== */
async function loadHist() { history = await (await fetch('/api/history')).json(); }
async function loadConns() { try { conns = await (await fetch('/api/connections')).json(); } catch (e) {} }
async function pollClaude() {
  try { claudeInfo = await (await fetch('/api/claude')).json(); } catch (e) { claudeInfo = { ok:false }; }
  if (!reviewActive) { const working = !!(claudeInfo.ok && claudeInfo.working); state.claude = working ? 'running' : 'idle';
    if (!live) { stage = working ? 1 : -1; renderPipe(); setHeader(working ? 'work' : 'idle'); } }
  renderRight();
}
/* ===== AI 연동(로그인) 창 — 앱 안에서 연결한 AI만 호출된다 ===== */
let connState = null;
const notConnHtml = k => (connState && connState[k] && connState[k].connected === false) ? `<div class="limsub" style="color:#f5b942;margin-top:8px">연결 안 됨 — 상단 '연동'에서 로그인하세요</div>` : '';
function applyConn() {
  if (!connState) return; const ok = k => connState[k] && connState[k].connected;
  $('conndot').style.background = (ok('codex') && ok('gemini')) ? '#34e0b0' : ((ok('codex') || ok('gemini')) ? '#f5b942' : '#ff5c6c');
  CONFIG.reviewers.forEach(k => { const cb = $('w-' + k); if (!cb) return; const was = cb.dataset.conn; cb.disabled = !ok(k); if (!ok(k)) cb.checked = false; else if (was === '0') cb.checked = true; cb.dataset.conn = ok(k) ? '1' : '0';
    if (cb.parentElement) cb.parentElement.style.opacity = ok(k) ? '' : '.45'; });
}
const cmdBox = c => `<div class="cmd"><code>${esc(c)}</code><button class="cbtn cpy" data-c="${esc(c)}">복사</button></div>`;
const isWin = () => !connState || !connState.env || connState.env.platform === 'win32';
const nodeHint = () => (connState && connState.env && !connState.env.node) ? '<div class="cwarn">먼저 Node.js(https://nodejs.org)를 설치해야 이 명령이 돼요.</div>' : '';
const claudeInstallCmd = () => isWin() ? 'irm https://claude.ai/install.ps1 | iex' : 'curl -fsSL https://claude.ai/install.sh | bash';
function claudeGuide(c) {
  if (!c.installed) return `<div class="cwarn">1단계 · 이 PC에 Claude Code가 없어요. 터미널(윈도우는 PowerShell)에 아래 명령을 붙여넣어 설치하세요.</div>${cmdBox(claudeInstallCmd())}<div class="cnote2">또는 npm이 있으면 <code>npm install -g @anthropic-ai/claude-code</code>. 설치 뒤 "상태 새로고침"을 누르세요.</div>`;
  if (!c.logged_in) return `<div class="cwarn">2단계 · Claude Code는 있는데 로그인이 안 돼 있어요. 아래 버튼으로 창을 열어 안내대로 로그인하세요(내 Claude 계정).</div><div class="cb"><button class="cbtn" id="cl-login">Claude 로그인 (창이 열려요)</button></div><div class="cnote2">창이 안 열리면 터미널에서 <code>claude</code> 를 실행하세요.</div>`;
  return `<div class="cnote2">Claude Code가 설치돼 있고 로그인돼 있어요. 평소처럼 Claude를 쓰면 사용량이 이 앱에 보여요(한도 %는 이 PC에서 알 수 없을 수 있어요).</div>`;
}
function renderConn() {
  const s = connState; if (!s) return; const badge = (on, txt) => `<span class="cbadge ${on ? 'on' : ''}">${txt}</span>`;
  const cx = s.codex, ge = s.gemini;
  $('conn').innerHTML = `<div class="ch"><b>AI 연동</b><button id="conn-x" title="닫기">×</button></div>
    <p class="cnote">이 앱은 <b>여기서 직접 연결한 AI만</b> 호출해요. 이 PC에 이미 있는 로그인·환경 변수는 몰래 쓰지 않습니다.</p>
    <div class="crow"><div class="ct"><b>Codex</b> <small>OpenAI</small> ${cx.connected ? badge(true, { app:'연결됨 · 앱 로그인', system:'연결됨 · 이 PC의 기존 로그인', demo:'연결됨 · 데모' }[cx.source] || '연결됨') : badge(false, '연결 안 됨')}</div>
      <div class="cb"><button class="cbtn" id="cx-login" ${cx.cli_installed ? '' : 'disabled'}>로그인 (창이 열려요)</button>${cx.source === 'app' ? '<button class="cbtn" id="cx-out">연결 해제</button>' : ''}<button class="cbtn" id="cx-ref">상태 새로고침</button></div>
      <label class="copt"><input type="checkbox" id="cx-sys" ${cx.use_system ? 'checked' : ''} ${cx.system_available ? '' : 'disabled'}> 이 PC에 이미 로그인된 Codex 쓰기 <small>(내 PC일 때만 켜세요)</small></label>
      ${cx.cli_installed ? '' : '<div class="cwarn">1단계 · Codex CLI가 이 PC에 없어요. 터미널에 아래 명령을 붙여넣어 설치한 뒤 "상태 새로고침"을 누르세요.</div>' + cmdBox('npm install -g @openai/codex') + nodeHint()}
      ${cx.cli_installed && !cx.connected ? '<div class="cnote2">2단계 · "로그인" 버튼 → 열린 창에서 내 OpenAI(ChatGPT) 계정으로 로그인 → 창을 닫고 "상태 새로고침".</div>' : ''}</div>
    <div class="crow"><div class="ct"><b>Gemini</b> <small>Google</small> ${ge.connected ? badge(true, { saved:'연결됨 · 키 저장됨', env:'연결됨 · 환경 변수', demo:'연결됨 · 데모' }[ge.source] || '연결됨') : badge(false, '연결 안 됨')}</div>
      <div class="cb"><input type="password" id="ge-key" placeholder="Gemini API 키 붙여넣기" autocomplete="off" spellcheck="false"><button class="cbtn" id="ge-save">저장</button>${ge.source === 'saved' ? '<button class="cbtn" id="ge-out">연결 해제</button>' : ''}</div>
      <label class="copt"><input type="checkbox" id="ge-env" ${ge.use_env ? 'checked' : ''} ${ge.env_available ? '' : 'disabled'}> 환경 변수 GEMINI_API_KEY 쓰기 <small>(내 PC일 때만 켜세요)</small></label>
      <div class="cnote2">${ge.source === 'saved' ? (ge.protected ? '키는 이 PC의 윈도우 계정으로 암호화되어 저장돼요.' : '이 PC는 암호화를 쓸 수 없어 파일 권한으로만 보호돼요.') : '키는 저장 전에 Google에 한 번 확인하고, 저장된 뒤에는 화면에 다시 나오지 않아요.'}${ge.connected ? '' : '<br>키가 없으면 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>에서 내 계정으로 무료 키를 만들 수 있어요(설치 필요 없음).'}</div></div>
    <div class="crow"><div class="ct"><b>Claude</b> <small>Anthropic</small> ${s.claude.installed && s.claude.logged_in ? badge(true, '준비됨 · 사용량 읽는 중') : badge(false, s.claude.installed ? '로그인 필요' : '설치 필요')}</div>${claudeGuide(s.claude)}<div class="cnote2">${esc(s.claude.note)}</div></div>
    <div class="cmsg" id="conn-msg"></div>`;
  $('conn-x').onclick = () => { $('conn').hidden = true; };
  document.querySelectorAll('#conn .cpy').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.c); b.textContent = '복사됨'; } catch (e) { b.textContent = '직접 선택해 복사'; } });
  if ($('cl-login')) $('cl-login').onclick = () => connAct('claude_login', {}, '열린 창에서 Claude 로그인을 마친 뒤 "상태 새로고침"을 누르세요.');
  $('cx-login').onclick = () => connAct('codex_login', {}, '열린 터미널 창에서 안내대로 로그인하세요. 끝나면 "상태 새로고침"을 누르세요.');
  if ($('cx-out')) $('cx-out').onclick = () => connAct('codex_logout', {}, 'Codex 연결을 해제했어요.');
  $('cx-ref').onclick = () => connAct('refresh', {}, '');
  $('cx-sys').onchange = e => connAct('codex_system', { on:e.target.checked }, '');
  $('ge-save').onclick = async () => { const v = $('ge-key').value.trim(); if (!v) { connMsg('키를 붙여넣어 주세요.', true); return; } connMsg('Google에 키를 확인하는 중…'); const ok = await connAct('gemini_save', { key:v }, 'Gemini 키를 저장했어요.'); if (ok && $('ge-key')) $('ge-key').value = ''; };
  if ($('ge-out')) $('ge-out').onclick = () => connAct('gemini_clear', {}, 'Gemini 연결을 해제했어요.');
  $('ge-env').onchange = e => connAct('gemini_env', { on:e.target.checked }, '');
}
const connMsg = (t, bad) => { const m = $('conn-msg'); if (m) { m.textContent = t; m.className = 'cmsg' + (bad ? ' bad' : ''); } };
async function connAct(action, extra, okText) {
  try { const r = action === 'refresh' ? await fetch('/api/connect') : await fetch('/api/connect', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ action, ...extra }) }), d = await r.json();
    if (!r.ok) { connMsg(d.error || '실패했어요.', true); return false; } connState = d; renderConn(); applyConn(); renderRight(); connMsg(okText || ''); return true; }
  catch (e) { connMsg('서버에 연결하지 못했어요.', true); return false; }
}
async function loadConn() { try { connState = await (await fetch('/api/connect')).json(); } catch (e) { return; } applyConn(); if (!$('conn').hidden) renderConn(); }
$('connbtn').onclick = e => { e.stopPropagation(); const p = $('conn'); p.hidden = !p.hidden; if (!p.hidden) { renderConn(); loadConn(); } };
document.addEventListener('click', e => { const p = $('conn'); if (!p.hidden && !p.contains(e.target) && e.target !== $('connbtn') && !$('connbtn').contains(e.target)) p.hidden = true; });
async function loadAll() { await Promise.all([loadHist(), loadConns(), loadModels(), pollClaude(), loadConn()]); renderRight(); renderLeft();
  try { if (connState && !connState.gemini.connected && !connState.codex.connected && !sessionStorage.getItem('conn-seen')) { sessionStorage.setItem('conn-seen', '1'); $('conn').hidden = false; renderConn(); } } catch (e) { /* 저장소가 막혀 있어도 동작 */ } }
$('refresh').onclick = loadAll;
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b)); renderRight(); });
setInterval(() => { const d = new Date(); $('clock').textContent = [d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':'); if (runStart && !runEnd) $('timer').textContent = mmss((Date.now()-runStart)/1000); }, 500);
setInterval(pollClaude, 3000);

function setTheme(t) {
  theme = t; const B = document.body.classList; flows = [];
  B.toggle('mission', t === 'mission' || t === 'light' || t === 'retro'); B.toggle('light', t === 'light'); B.toggle('retro', t === 'retro' || t === 'mission'); B.toggle('ocean', t === 'ocean'); B.toggle('solar', t === 'solar');
  const pal = { mission:[[57,255,106], '#39ff6a', '#c8ffc8'], light:[[40,60,90], '#1f6fb2', '#1b2430'], retro:[[57,255,106], '#39ff6a', '#c8ffc8'] }[t];   // 관제실 = 레트로 초록
  if (pal) { ACC = pal[0]; AMB = pal[1]; TXT = pal[2]; }
  $('dd-menu').querySelectorAll('button').forEach(b => { const on = b.dataset.th === t; b.classList.toggle('on', on); if (on) $('dd-cur').textContent = b.querySelector('b').textContent; });
  try { localStorage.setItem('trinity-theme', t); } catch (e) { /* 저장 안 돼도 화면은 동작 */ }
  document.title = ({ mission:'MISSION CONTROL', ocean:'OCEAN', light:'LIGHT', retro:'RETRO TERMINAL' }[t] || 'TRINITY') + ' · AI 팀 관제';
}
const ddClose = () => { $('dd-menu').hidden = true; $('dd-btn').setAttribute('aria-expanded', 'false'); };
$('dd-btn').onclick = e => { e.stopPropagation(); const open = $('dd-menu').hidden; $('dd-menu').hidden = !open; $('dd-btn').setAttribute('aria-expanded', String(open)); };   // 누르면 아래로 펼쳐짐
$('dd-menu').querySelectorAll('button').forEach(b => b.onclick = () => { setTheme(b.dataset.th); ddClose(); });                                                  // 고른 것만 바뀜
document.addEventListener('click', e => { if (!$('dd').contains(e.target)) ddClose(); });
addEventListener('keydown', e => { if (e.key === 'Escape') ddClose(); });
try { const saved = localStorage.getItem('trinity-theme'); if (saved === 'ocean' || saved === 'mission') setTheme(saved); else if (saved === 'retro') setTheme('mission'); else setTheme('solar'); } catch (e) {}
{ const q = new URLSearchParams(location.search).get('theme'); if (['solar', 'ocean', 'mission'].includes(q)) setTheme(q); }      // 주소의 ?theme= 로 디자인을 바로 지정(스크린샷·공유용)
layout(); renderPipe(); frame(); loadAll();
</script>
