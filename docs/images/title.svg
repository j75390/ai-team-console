    </linearGradient>
    <clipPath id="c">
      <rect x="170.0" y="40" height="110" width="0">
        <animate attributeName="width" values="0;660;660;0" keyTimes="0;0.35;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
