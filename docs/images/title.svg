  </defs>
  <text x="500" y="120" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="url(#g)" textLength="640" lengthAdjust="spacingAndGlyphs" clip-path="url(#c)">AI TEAM CONSOLE</text>
  <rect y="62" width="5" height="70" rx="2" fill="#A78BFA">
    <animate attributeName="x" values="172.0;826.0;826.0;172.0" keyTimes="0;0.35;0.85;1" dur="7s" repeatCount="indefinite"/>
