  </rect>
  <text x="500" y="178" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" fill="#8b949e" opacity="0">Claude · Codex · Gemini 관제 화면
